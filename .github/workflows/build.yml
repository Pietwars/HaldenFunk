name: Firmware-Build
on:
  push:
    # Nur main und Versions-Tags; PR-Branches laufen über pull_request (keine Doppelläufe push + pull_request)
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
# Überholte Läufe abbrechen: Ein neuer Push auf denselben PR bzw. Nicht-main-Branch bricht den älteren Lauf ab.
# main, Tags und manuelle Läufe bekommen je eine eigene Gruppe (run_id) und werden nie abgebrochen oder verdrängt.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Versionsprüfung (VERSION ist die einzige Quelle)
        run: python tools/version.py --check && python tests/version.test.py
      - name: Kartenprüfung
        run: python tests/maps.test.py
      - name: Flash- und Speicherprüfung (Hosttests, aus DisAHRsterRadio-MeshCore 0.9.4)
        run: python tests/memory_validation.test.py -v
      - name: Kern-Abgleich (nur in Regionalvarianten mit region/CORE, z. B. HaldenFunk)
        if: hashFiles('region/CORE') != ''
        run: python tools/core_sync.py --check
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Nur noch LILYGO T-Deck Plus und LILYGO T-Watch S3; die alten Profile (T3-S3, T3 V1.6.1, Heltec V2) bleiben in
        # firmware/platformio.ini, werden aber nicht mehr gebaut.
        env: [tdeck-sx1262, twatch-s3-sx1262]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.2.0
      # Firmware-Build und buildfs leeren jeweils das Build-Verzeichnis -> Ergebnisse nach jedem Schritt sichern
      - name: Firmware bauen
        working-directory: firmware
        shell: bash
        run: |
          set -o pipefail
          pio run -e ${{ matrix.env }} | tee ../build-${{ matrix.env }}.log
          mkdir -p ../artefakt && cp .pio/build/${{ matrix.env }}/{firmware,bootloader,partitions}.bin ../artefakt/
      - name: Dateisystem (Web-UI) bauen
        working-directory: firmware
        run: |
          pio run -e ${{ matrix.env }} -t buildfs
          cp .pio/build/${{ matrix.env }}/littlefs.bin ../artefakt/
      - name: Flash/Header/Partitionen/Firmware und RAM prüfen
        run: >-
          python3 tools/validate_memory.py --env ${{ matrix.env }} --build-dir artefakt
          --build-log build-${{ matrix.env }}.log --output artefakt/speicherbericht
          && cat artefakt/speicherbericht.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          if-no-files-found: error
          path: artefakt/*

