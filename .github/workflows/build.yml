name: Firmware-Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Versionsprüfung (VERSION ist die einzige Quelle)
        run: python tools/version.py --check && python tests/version.test.py
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [t3s3-sx1262, t3-v161-sx1276, heltec-v2-sx1276, heltec-v2-sx1276-wifi11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.2.0
      # Firmware-Build und buildfs leeren jeweils das Build-Verzeichnis -> Ergebnisse nach jedem Schritt sichern
      - name: Firmware bauen
        working-directory: firmware
        run: |
          pio run -e ${{ matrix.env }}
          mkdir -p ../artefakt && cp .pio/build/${{ matrix.env }}/{firmware,bootloader,partitions}.bin ../artefakt/
      - name: Dateisystem (Web-UI) bauen
        working-directory: firmware
        run: |
          pio run -e ${{ matrix.env }} -t buildfs
          cp .pio/build/${{ matrix.env }}/littlefs.bin ../artefakt/
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          if-no-files-found: error
          path: artefakt/*.bin
