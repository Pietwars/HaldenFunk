name: Entwicklungszweig Kernabgleich 0.9.4
on:
  push:
    branches: [dev/align-disahr-095]
    paths:
      - .github/workflows/dev-core-sync.yml
      - VERSION
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/align-disahr-095
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regional-Overlay auf gepinnten 0.9.4-Kern rebasen
        run: python3 tools/rebase_region_094.py
      - name: Kern und Regional-Overlay prüfen
        run: python3 tools/core_sync.py --check
      - name: Synchronisierten Stand committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(core): gleiche LoRaLayer2-Kern auf DisAHRsterRadio 0.9.4 ab"
          git push origin HEAD:dev/align-disahr-095
