name: Release
# Baut bei jedem Versions-Tag v* alle Boards, packt factory.bin + Teile + SHA256SUMS + ANLEITUNG,
# prüft die Pakete und veröffentlicht eine GitHub-Vorabversion. Fehlt eine Datei, bricht der Lauf ab.
on:
  push:
    tags: ['v*']
  pull_request:
    # Probelauf ohne Veröffentlichung, wenn sich Paketierung oder dieser Workflow ändern
    paths: ['tools/package.sh', 'tools/verify_release.py', 'tools/release_notes.py', 'tools/ANLEITUNG.template.md', '.github/workflows/release.yml', 'firmware/platformio.ini']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Vorhandener Tag, z. B. v0.1.1-alpha'
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
# Überholte Läufe abbrechen: Ein neuer Push auf denselben PR bzw. Nicht-main-Branch bricht den älteren Lauf ab.
# main, Tags und manuelle Läufe bekommen je eine eigene Gruppe (run_id) und werden nie abgebrochen oder verdrängt.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Release-Boards: LILYGO T-Deck Plus und LILYGO T-Watch S3 (Heltec V2 und T3-Boards nicht mehr im Release; ältere Releases unverändert)
        env: [tdeck-sx1262, twatch-s3-sx1262]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag passt zur Datei VERSION
        run: |
          python tools/version.py --check
          V=$(python tools/version.py --get)
          [ -z "$TAG" ] || [ "$TAG" = "v$V" ] || { echo "Tag $TAG passt nicht zu VERSION=$V"; exit 1; }
      - run: pip install platformio==6.2.0 esptool==5.6.0
      - name: Bauen und packen
        run: ENVS="${{ matrix.env }}" tools/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: paket-${{ matrix.env }}
          path: dist/*.zip
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Pakete prüfen (Vollständigkeit, Prüfsummen, Version)
        run: |
          V=$(python3 tools/version.py --get)
          python3 tools/verify_release.py dist HaldenFunk "$V" littlefs.bin tdeck twatch-s3
          (cd dist && sha256sum *.zip > SHA256SUMS-HaldenFunk-$V.txt)
      - name: Flyer zur Tag-Version neu erzeugen
        run: |
          python3 -m pip install 'qrcode[pil]'
          python3 tools/flyer/flyer.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ('HaldenFunk-Flyer.pdf', 'HaldenFunk-Flyer-digital.pdf'):
              path = Path('docs/flyer') / name
              assert path.is_file() and path.stat().st_size > 10000 and path.open('rb').read(5) == b'%PDF-', name
          PY
      - name: Release-Text erzeugen
        run: |
          python3 tools/release_notes.py "$(python3 tools/version.py --get)" "${{ github.repository }}" HaldenFunk \
            "tdeck=LILYGO T-Deck Plus (SX1262)" "twatch-s3=LILYGO T-Watch S3 (SX1262)" | tee notes.md
      - name: Release veröffentlichen
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="dist/*.zip dist/SHA256SUMS-*.txt"
          for f in docs/flyer/*-Flyer.pdf docs/flyer/*-Flyer-digital.pdf; do [ -f "$f" ] && ASSETS="$ASSETS $f"; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            case "$TAG" in *-*) gh release create "$TAG" --prerelease --verify-tag --title "HaldenFunk $TAG (Vorabversion)" --notes-file notes.md $ASSETS;;
              *) gh release create "$TAG" --verify-tag --title "HaldenFunk $TAG" --notes-file notes.md $ASSETS;; esac
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
