; HaldenFunk – PlatformIO-Konfiguration
; Basis: sudomesh/disaster-radio, modernisiert (Arduino-ESP32 3.x via pioarduino, RadioLib 7, LittleFS)

[platformio]
src_dir = .
data_dir = ../web/static
default_envs = tdeck-sx1262, twatch-s3-sx1262

[env]
; Feste Versionen (reproduzierbare Builds): pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5
; Aktualisieren: Version hier und in lib_deps anheben, CI abwarten, Hardware prüfen.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = custompart.csv
board_build.filesystem = littlefs
build_src_filter = +<*> -<lib/> -<.pio/> -<.git/>
lib_deps =
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    jgromes/RadioLib @ 7.8.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ 4.6.2
    mikalhart/TinyGPSPlus @ 1.1.0
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -I./src
    -DCORE_DEBUG_LEVEL=0
    ; Keine C++-Ausnahmen: Firmware und Bibliotheken nutzen kein try/catch (ein throw endete schon
    ; bisher in abort/Neustart). Spart ~19 KB Flash (Unwind-Tabellen .eh_frame).
    -fno-exceptions
build_unflags =
    -fexceptions

[env:t3s3-sx1262]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags = ${env.build_flags}
    -DLILYGO_T3S3_SX1262
    -DRL_SX1262
    -DHAS_OLED
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:t3-v161-sx1276]
board = ttgo-lora32-v21
build_flags = ${env.build_flags}
    -DLILYGO_T3_V161
    -DRL_SX1276
    -DHAS_OLED

[env:heltec-v2-sx1276]
board = heltec_wifi_lora_32_V2
build_flags = ${env.build_flags}
    -DHELTEC_V2
    -DRL_SX1276
    -DHAS_OLED

; Alternative mit 11 dBm WLAN-Sendeleistung (falls 8,5 dBm zu schwach)
[env:heltec-v2-sx1276-wifi11]
board = heltec_wifi_lora_32_V2
build_flags = ${env.build_flags}
    -DHELTEC_V2
    -DHELTEC_WIFI_11DBM
    -DRL_SX1276
    -DHAS_OLED


; LILYGO T-Deck / T-Deck Plus (ESP32-S3, SX1262, 16 MB Flash). Ohne Display-Treiber, Bedienung über WLAN.
; Partitionstabelle wie die übrigen Boards (custompart.csv, 4 MB genutzt).
[env:tdeck-sx1262]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = ${env.build_flags}
    -DLILYGO_TDECK
    -DRL_SX1262
    -DLORA_DIO2_RF_SWITCH=0   ; T-Deck: DIO2 nicht als RF-Schalter (gilt auch für lib/LoRaLayer2)
    -DARDUINO_USB_CDC_ON_BOOT=1

; Experimental local T-Deck UI. Separate opt-in profile: stable T-Deck release remains WiFi-only.
[env:tdeck-screen-test]
extends = env:tdeck-sx1262
extra_scripts = pre:scripts/tdeck_tft_spi.py
board_build.embed_files = assets/tdeck-splash.rgb565
build_flags = ${env:tdeck-sx1262.build_flags}
    -DTDECK_SCREEN
    -DUSER_SETUP_LOADED
    -DLOAD_GLCD
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=41
    -DTFT_MISO=38
    -DTFT_SCLK=40
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=-1
    -DTFT_RGB_ORDER=TFT_BGR
    -DSPI_FREQUENCY=27000000
lib_deps = ${env.lib_deps}
    bodmer/TFT_eSPI @ 2.5.43

; Release profile: identical local UI and hardware configuration to the tested profile.
[env:tdeck-standalone]
extends = env:tdeck-screen-test

; LILYGO T-Watch S3 (ESP32-S3, SX1262, AXP2101, 16 MB Flash). Ohne Display-Treiber, Bedienung über WLAN.
[env:twatch-s3-sx1262]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = ${env.build_flags}
    -DLILYGO_TWATCH_S3
    -DRL_SX1262
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = ${env.lib_deps}
    lewisxhe/XPowersLib @ 0.2.9

; Combined WLAN + PIN-free BLE UART prototypes. Different app/filesystem layout:
; back up first and flash the complete factory + filesystem image, not app-only.
[env:t3s3-sx1262-ble]
extends = env:t3s3-sx1262
board_build.partitions = huge_app.csv
build_flags = ${env:t3s3-sx1262.build_flags} -DHAS_BLE

[env:t3-v161-sx1276-ble]
extends = env:t3-v161-sx1276
board_build.partitions = huge_app.csv
build_flags = ${env:t3-v161-sx1276.build_flags} -DHAS_BLE

[env:heltec-v2-sx1276-ble]
extends = env:heltec-v2-sx1276
board_build.partitions = huge_app.csv
build_flags = ${env:heltec-v2-sx1276.build_flags} -DHAS_BLE

; Omi-Version ("ganz einfach"): ein Bildschirm (schreiben, senden, lesen), festes Funkprofil EU Narrow,
; keine Einstellungen, kein Menue, kein BLE, keine Konsole, OLED nur mit festem Statustext,
; Captive Portal (Seite oeffnet sich nach dem WLAN-Verbinden von selbst), WLAN "Notfunk-XXXXXX".
; Auf Funk kompatibel mit den normalen Builds. Weboberflaeche aus ../web/omi (siehe omi_data.py).
[env:t3-v161-omi]
extends = env:t3-v161-sx1276
extra_scripts = pre:omi_data.py
build_flags = ${env:t3-v161-sx1276.build_flags} -DDAR_OMI

[env:heltec-v2-omi]
extends = env:heltec-v2-sx1276
extra_scripts = pre:omi_data.py
build_flags = ${env:heltec-v2-sx1276.build_flags} -DDAR_OMI

[env:t3s3-omi]
extends = env:t3s3-sx1262
extra_scripts = pre:omi_data.py
build_flags = ${env:t3s3-sx1262.build_flags} -DDAR_OMI
