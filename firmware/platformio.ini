; HaldenFunk – PlatformIO-Konfiguration
; Basis: sudomesh/disaster-radio, modernisiert (Arduino-ESP32 3.x via pioarduino, RadioLib 7, LittleFS)

[platformio]
src_dir = .
data_dir = ../web/static
default_envs = t3s3-sx1262, t3-v161-sx1276, heltec-v2-sx1276

[env]
; Feste Versionen (reproduzierbare Builds): pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5
; Aktualisieren: Version hier und in lib_deps anheben, CI abwarten, Hardware prüfen.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = custompart.csv
board_build.filesystem = littlefs
build_src_filter = +<*> -<lib/> -<.pio/> -<.git/>
lib_deps =
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    jgromes/RadioLib @ 7.8.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ 4.6.2
    mikalhart/TinyGPSPlus @ 1.1.0
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -I./src
    -DCORE_DEBUG_LEVEL=0

[env:t3s3-sx1262]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags = ${env.build_flags}
    -DLILYGO_T3S3_SX1262
    -DRL_SX1262
    -DHAS_OLED
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:t3-v161-sx1276]
board = ttgo-lora32-v21
build_flags = ${env.build_flags}
    -DLILYGO_T3_V161
    -DRL_SX1276
    -DHAS_OLED

[env:heltec-v2-sx1276]
board = heltec_wifi_lora_32_V2
build_flags = ${env.build_flags}
    -DHELTEC_V2
    -DRL_SX1276
    -DHAS_OLED

; Alternative mit 11 dBm WLAN-Sendeleistung (falls 8,5 dBm zu schwach)
[env:heltec-v2-sx1276-wifi11]
board = heltec_wifi_lora_32_V2
build_flags = ${env.build_flags}
    -DHELTEC_V2
    -DHELTEC_WIFI_11DBM
    -DRL_SX1276
    -DHAS_OLED
